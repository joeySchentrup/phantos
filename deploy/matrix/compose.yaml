# The Phantos chat server: Synapse and its Postgres database, for the NAS.
#
# TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML, and paste this file.
# Setup steps (datasets, secrets, proxies) are in README.md beside it.
#
# Replace every REPLACE_ME first: the dataset paths and the database password.
# The password must match `database.args.password` in homeserver.yaml.

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    # TrueNAS's "apps" user, so the database files stay owned by it.
    user: "568:568"
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: REPLACE_ME_POSTGRES_PASSWORD
      POSTGRES_DB: synapse
      # Synapse refuses a database that doesn't sort text as plain bytes (locale C).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - /mnt/main/ix-applications/phantos-matrix/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse", "-d", "synapse"]
      interval: 10s
      timeout: 5s
      retries: 10

  synapse:
    image: matrixdotorg/synapse:v1.163.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Run as TrueNAS's "apps" user, so the files Synapse writes stay owned by it.
      UID: "568"
      GID: "568"
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      # Holds homeserver.yaml and phantos-appservice.yaml (copied in by hand), plus the
      # signing key and uploaded media, which Synapse creates itself.
      - /mnt/main/ix-applications/phantos-matrix/synapse:/data
    ports:
      # Proxy 2 forwards the chat subdomain here. Don't open this port to the internet.
      - "30679:8008"
